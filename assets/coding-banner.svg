          attributeName="transform"
          type="rotate"
          from="0 150 116"
          to="360 150 116"
          dur="8s"
          repeatCount="indefinite"
        />
      </circle>

      <!-- moving outer node -->
      <circle
        r="5"
        fill="#65e8d2"
        filter="url(#softGlow)"
      >
        <animateMotion
          dur="6s"
          repeatCount="indefinite"
          rotate="auto"
        >
          <mpath href="#orbit1"/>
        </animateMotion>
      </circle>

    </g>


    <!-- ================================================== -->
    <!-- SECOND ORBIT -->
    <!-- ================================================== -->

    <g>

      <circle
        cx="150"
        cy="116"
        r="91"
