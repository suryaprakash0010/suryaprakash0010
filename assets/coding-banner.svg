  <!-- ====================================================== -->
  <!-- RIGHT SIDE ANIMATED SYSTEM -->
  <!-- ====================================================== -->

  <g transform="translate(833 83)">

    <!-- Large ambient glow -->
    <circle
      cx="150"
      cy="116"
      r="150"
      fill="url(#coreGlow)"
      opacity=".35"
    >
