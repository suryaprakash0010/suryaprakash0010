<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Surya Prakash Kahar — Coding Profile</title>
  <desc id="desc">Animated developer profile banner showing competitive programming ratings and coding statistics.</desc>

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10132b"/>
      <stop offset=".55" stop-color="#171638"/>
      <stop offset="1" stop-color="#111b35"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#65e8d2"/>
      <stop offset=".5" stop-color="#8e8cff"/>
      <stop offset="1" stop-color="#fa78bd"/>
    </linearGradient>

    <!-- Animated glow -->
    <radialGradient id="glow">
      <stop stop-color="#715cff" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#715cff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#715cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#8e8cff" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#65e8d2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#65e8d2" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path
        d="M34 0H0V34"
        fill="none"
        stroke="#b9c5ff"
        stroke-opacity=".07"
        stroke-width="1"
      />
      <circle
        cx="0"
        cy="0"
        r="1.5"
        fill="#c1caff"
        fill-opacity=".18"
      />
    </pattern>

    <!-- Glow filters -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orbit paths -->
    <path
      id="orbit1"
      d="M150 116
         m-120 0
         a120 120 0 1 0 240 0
         a120 120 0 1 0-240 0"
    />

    <path
      id="orbit2"
      d="M150 116
         m-91 0
         a91 91 0 1 0 182 0
         a91 91 0 1 0-182 0"
    />

    <path
      id="orbit3"
      d="M150 116
         m-62 0
         a62 62 0 1 0 124 0
         a62 62 0 1 0-124 0"
    />

  </defs>

  <!-- ====================================================== -->
  <!-- BACKGROUND -->
  <!-- ====================================================== -->

  <rect
    width="1200"
    height="400"
    rx="24"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="400"
    rx="24"
    fill="url(#grid)"
  />

  <!-- Animated background glow -->
  <ellipse
    cx="940"
    cy="195"
    rx="330"
    ry="260"
    fill="url(#glow)"
  >
    <animate
      attributeName="opacity"
      values=".55;1;.55"
      dur="5s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="rx"
      values="300;350;300"
      dur="7s"
      repeatCount="indefinite"
    />
  </ellipse>

  <!-- Bottom wave -->
  <path
    d="M0 328C196 270 302 377 493 323s293-60 424-15 190 35 283-8v100H0Z"
    fill="#151936"
    opacity=".6"
  />

  <path
    d="M0 350c210-65 331 22 516-21s322-88 684-5"
